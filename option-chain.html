<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option Chain</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            background: #f7f9fc;
            color: #333;
        }

        header {
            background: #1a237e;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.4rem; font-weight: 700; }
        .logo span { color: #90caf9; }

        nav ul {
            display: flex;
            gap: 20px;
            list-style: none;
        }
        nav a { color: #fff; text-decoration: none; }

        .container {
            max-width: 1300px;
            margin: auto;
            padding: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #eef1f7;
            padding: 8px;
            text-transform: uppercase;
        }

        td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .call { background: #e8f5e9; }
        .put { background: #ffebee; }
        .strike { background: #e8eaf6; font-weight: bold; }

        tr:hover td { background: #f3f6ff; }

    </style>

</head>
<body>

<header>
    <div class="logo">Options<span>Analyst</span></div>
    <nav>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="option-chain.html">Option Chain</a></li>
        </ul>
    </nav>
</header>

<div class="container">
    <h2>NIFTY Weekly Option Chain</h2>

    <table>
        <thead>
            <tr>
                <th colspan="4" style="color:#2e7d32;">CALLS</th>
                <th>Strike</th>
                <th colspan="4" style="color:#c62828;">PUTS</th>
            </tr>
            <tr>
                <th>OI</th>
                <th>Chg OI</th>
                <th>LTP</th>
                <th>IV</th>

                <th></th>

                <th>IV</th>
                <th>LTP</th>
                <th>Chg OI</th>
                <th>OI</th>
            </tr>
        </thead>

        <tbody id="option-table-body"></tbody>
    </table>
</div>


<script>
async function loadOptionChain() {

    const url = "[api.theautotrender.com](https://api.theautotrender.com:5959/api/Index/call-put?category=Nifty&expiry=12-May-2026)";

    try {
        const res = await fetch(url);
        const jsonData = await res.json();

        const data = jsonData.data; // Your "data" array
        const tbody = document.getElementById("option-table-body");
        tbody.innerHTML = "";

        data.forEach(item => {

            const strike = item.strike.value;

            const call = item.OptionsData.call;
            const put = item.OptionsData.put;

            const row = document.createElement("tr");

            row.innerHTML = `
                <td class="call">${call.oi_lakh.value}</td>
                <td class="call">${call.oi_chg.value}</td>
                <td class="call">${call.ltp.value}</td>
                <td class="call">${call.iV}</td>

                <td class="strike">${strike}</td>

                <td class="put">${put.iV}</td>
                <td class="put">${put.ltp.value}</td>
                <td class="put">${put.oi_chg.value}</td>
                <td class="put">${put.oi_lakh.value}</td>
            `;

            tbody.appendChild(row);
        });

    } catch (err) {
        console.error("Error loading data:", err);
        alert("Unable to load option chain data");
    }
}

loadOptionChain();
</script>

</body>
</html>
