<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option Chain</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            background: #f7f9fc;
            color: #333;
        }

        /* Header */
        header {
            background: #1a237e;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .logo span {
            color: #90caf9;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        nav a:hover {
            color: #90caf9;
        }

        .container {
            max-width: 1300px;
            margin: auto;
            padding: 2rem;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1a237e;
            margin-bottom: 1.5rem;
        }

        .selectors {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        select {
            padding: 0.6rem 1rem;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: #fff;
            font-size: 0.9rem;
        }

        select:focus {
            outline: none;
            border-color: #1a237e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        th {
            background: #f0f3fa;
            padding: 0.7rem;
            font-size: 0.85rem;
            color: #444;
            text-transform: uppercase;
        }

        td {
            padding: 0.7rem;
            text-align: center;
            border-bottom: 1px solid #f1f1f1;
            font-size: 0.9rem;
        }

        tbody tr:hover {
            background: #f6f9ff;
        }

        .strike {
            background: #e8eaf6;
            font-weight: bold;
            color: #1a237e;
        }

        .call {
            background: #e8f5e9;
        }

        .put {
            background: #ffebee;
        }

        footer {
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
            background: #1a237e;
            color: rgba(255,255,255,0.8);
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Options<span>Analyst</span></div>
    <nav>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="option-chain.html">Option Chain</a></li>
            <li><a href="#">OI Analysis</a></li>
            <li><a href="#">Strategies</a></li>
            <li><a href="#">Charts</a></li>
        </ul>
    </nav>
</header>

<div class="container">

    <div class="section-title">Option Chain</div>

    <div class="selectors">
        <select>
            <option>NIFTY</option>
            <option>BANKNIFTY</option>
            <option>FINNIFTY</option>
        </select>

        <select>
            <option>08 May 2025</option>
            <option>15 May 2025</option>
            <option>22 May 2025</option>
        </select>
    </div>

    <!-- Table -->
    <table>
        <thead>
            <tr>
                <th colspan="4" style="color:#2e7d32;">CALLS</th>
                <th>Strike</th>
                <th colspan="4" style="color:#c62828;">PUTS</th>
            </tr>
            <tr>
                <th>OI</th>
                <th>Chg OI</th>
                <th>LTP</th>
                <th>IV</th>
                <th></th>
                <th>IV</th>
                <th>LTP</th>
                <th>Chg OI</th>
                <th>OI</th>
            </tr>
        </thead>

        <tbody id="option-table-body">
            <!-- API injected rows -->
        </tbody>
    </table>
</div>

<footer>
    Option Chain • For educational use only
</footer>

<script>
async function loadOptionChain() {
    const url = "[api.theautotrender.com](https://api.theautotrender.com:5959/api/Index/call-put?category=Nifty&expiry=12-May-2026)";

    try {
        const res = await fetch(url);
        const data = await res.json();

        const tbody = document.getElementById("option-table-body");
        tbody.innerHTML = "";

        data.forEach(row => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td class="call">${row.callOI}</td>
                <td class="call">${row.callChangeOI}</td>
                <td class="call">${row.callLTP}</td>
                <td class="call">${row.callIV}</td>

                <td class="strike">${row.strikePrice}</td>

                <td class="put">${row.putIV}</td>
                <td class="put">${row.putLTP}</td>
                <td class="put">${row.putChangeOI}</td>
                <td class="put">${row.putOI}</td>
            `;

            tbody.appendChild(tr);
        });

    } catch (e) {
        console.error("API Error:", e);
        alert("Unable to load option chain data.");
    }
}

loadOptionChain();
</script>

</body>
</html>
